<html>
    <body>
        YEAR:<input type="text " id="year_get"><br><br>MONTH
        (1-12)<input type="text " id="month_get"><br><br>
        <input type="button" id="submit" value="display calender " onclick="generate()"><br><br>
        <div id="content"></div>
    </body>   
    <script>
        function generate()
        {
            var init_content="<table BORDER=1 id='calender'><tr><th>sun</th><th>mon</th><th>tur</th><th>wed</th><th>thu</th><th>fri</th><th>sat</th></tr><tr>"
                var year_get=document.getElementById("year_get").value;
                 var month_get=document.getElementById("month_get").value;
                 month_get-=1;
                 var date=new Date(year_get,month_get);
                 var day=date.getDate();
                 for(var i=0;i<day;i++)
                 {
                    init_content +="<td></td>";

                 }
                   while(date.getMonth() == month_get)
    {
        init_content += "<td>" + date.getDate() + "</td>";

        if(date.getDay() == 6)
        {
            init_content += "</tr><tr>";
        }

        date.setDate(date.getDate() + 1);
    }

    init_content += "</tr></table>";

    document.getElementById("content").innerHTML =
        init_content;
}


        
    </script>
     
</html>
