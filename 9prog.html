<html>
    <head>
        <title>registration form</title>
    </head>
    <body>
        <h1><center> student registration</center></h1>
        <table align="center">
            <form action="" method="">
                <tr><td>name:</td>
                    <td><input type="text"></td>
                </tr>

                <tr><td>roll no:</td>
                    <td><input type="text"></td>
                </tr>

                <tr><td>admission no:</td>
                    <td><input type="text"></td>
                </tr>

                <tr><td>DOB:</td>
                    <td><input type="date"></td>
                </tr>

                <tr><td>sex:</td>
                    <td><input type="radio">
                    <label>male</label>
                    
                    <label>female</label>
                    </td>
                </tr>

                <tr><td>phone no:</td>
                    <td><input type="text"></td>
                </tr>

                <tr><td>email id:</td>
                    <td><input type="text"></td>
                </tr>

            
        </table>
        <center><input type="submit" value="submit"
        </center>
        </form>
    </body>
</html>
